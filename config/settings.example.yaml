app:
  name: sqlmate
  prompts_dir: node_prompts
  knowledge_dir: knowledge
  log_dir: logs
  output_dir: output

observability:
  workflow_name: SqlMate Workflow
  enable_sdk_tracing: false
  openai_trace_api_key: ${OPENAI_TRACE_API_KEY:-}
  include_sensitive_data: false

planner:
  debate_rounds: 1
  max_turns: 12
  max_output_tokens: 32768
  max_tool_rounds: 2

knowledge:
  max_matches_per_topic: 3
  max_tool_rounds: 6
  enable_claude_index: true
  claude_command: claude
  claude_permission_mode: bypassPermissions
  claude_use_add_dir: true
  claude_timeout_seconds: 18000
  claude_max_output_chars: 40000
  doc_knowledge_dir: ${SQLMATE_DOC_KNOWLEDGE_DIR:-knowledge}
  doc_knowledge_dirs:
    - ${SQLMATE_DOC_KNOWLEDGE_DIR:-knowledge}
  sql_examples_dir: knowledge/sql_examples_empty
  max_tool_found_items: 10
  max_tool_item_content_chars: 3000

executor:
  type: mock
  max_repair_rounds: 0
  phase_timeout_seconds: 1800
  allow_phase_fallback: true

ui:
  approval_mode: interactive
  show_banner: true
  show_raw_json: false
  show_think_stream: false

providers:
  ark_primary:
    base_url: ${SQLMATE_PRIMARY_BASE_URL:-https://api.deepseek.com}
    api_key: ${SQLMATE_PRIMARY_API_KEY:-}
    model: ${SQLMATE_PRIMARY_MODEL:-deepseek-chat}
    use_responses: false
    timeout_seconds: ${SQLMATE_PRIMARY_TIMEOUT:-1800}
    max_retries: 2
    enable_thinking: false
    verify_ssl: ${SQLMATE_PRIMARY_VERIFY_SSL:-true}
  ark_secondary:
    base_url: ${SQLMATE_SECONDARY_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
    api_key: ${SQLMATE_SECONDARY_API_KEY:-}
    model: ${SQLMATE_SECONDARY_MODEL:-doubao-seed-2-0-pro-260215}
    use_responses: false
    timeout_seconds: ${SQLMATE_SECONDARY_TIMEOUT:-1800}
    max_retries: 2
    enable_thinking: false
    verify_ssl: ${SQLMATE_SECONDARY_VERIFY_SSL:-true}
  ark_glm:
    base_url: ${SQLMATE_GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
    api_key: ${SQLMATE_GLM_API_KEY:-}
    model: ${SQLMATE_GLM_MODEL:-glm-5.2}
    use_responses: false
    timeout_seconds: ${SQLMATE_GLM_TIMEOUT:-1800}
    max_retries: 2
    supports_json_schema: true
    enable_thinking: true
    verify_ssl: ${SQLMATE_GLM_VERIFY_SSL:-true}

node_bindings:
  PLANNER_DRAFT:
    provider: ark_primary
    max_turns: 6
  PLANNER_CRITIC:
    provider: ark_primary
    max_turns: 3
  PLANNER_FINALIZER:
    provider: ark_primary
    max_turns: 3
  PLANNER_REVISION:
    provider: ark_primary
    max_turns: 4
  SETUP_PLAN_REFINER:
    provider: ark_primary
    max_turns: 6
  DDL_PLAN_REFINER:
    provider: ark_primary
    max_turns: 6
  CORE_PLAN_REFINER:
    provider: ark_primary
    max_turns: 6
  SETUP:
    provider: ark_primary
    max_turns: 3
  DDL:
    provider: ark_primary
    max_turns: 3
  CORE:
    provider: ark_primary
    max_turns: 3
  SQL_REPAIR:
    provider: ark_primary
    max_turns: 3
